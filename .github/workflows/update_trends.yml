name: Push Tech Trends to WordPress

on:
  schedule:
    - cron: '*/30 * * * *' # 30분 마다 자동 실행
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Collector and Push to WP
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_SECRET: ${{ secrets.WP_SECRET }}
        run: python collector.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trending_history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update history" && git push)
